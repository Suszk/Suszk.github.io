name: tmp-crawl
on:
  push:
    branches: [tmp-crawl]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: tmp-crawl }
      - run: |
          set +e
          UA="Mozilla/5.0 (Macintosh) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          mkdir -p _tmp
          g() { curl -sSfL -m 40 -A "$UA" -o "_tmp/$1" "$2"; ls -la "_tmp/$1"; }
          g ananth.jpeg https://denvibes.com/wp-content/uploads/2024/03/ananth-denvibes.jpeg
          g favicon.png https://denvibes.com/wp-content/uploads/2023/05/cropped-denvibes-favicon-270x270.png
          g logo.png https://denvibes.com/wp-content/uploads/2023/05/cropped-logo.png
          g logo-white.png https://denvibes.com/wp-content/uploads/2023/05/logo-white.png
          g spectrum.png https://framerusercontent.com/images/ablNSatFYHvnqre9YvcPlrHh0Lg.png
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -A _tmp; git commit -qm "tmp: assets3" || true; git push origin HEAD:tmp-crawl
