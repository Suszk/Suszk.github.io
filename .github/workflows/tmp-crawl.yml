name: tmp-crawl
on:
  push:
    branches: [tmp-crawl]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: tmp-crawl }
      - name: Drive photos
        run: |
          set +e
          pip install -q pillow pillow-heif
          mkdir -p _tmp/drive
          for id in 1KDm-FHmAbos6MbbBto9JfEw4wAsSHQ4- 1wpvV25I5EJP43nuMURfND_l05lqq6xqy 1cMmhJOhPifalYX7A30ogoLpv_EioLYpJ 10hzjvLpmzdUSnnokhymBfC3w0vVLVhZK 17yEtopbdbBowp1cwmHf6GdkceWsClnA5 12_Yw24Gmme7zfKp4asdLKP9BhQMaFDoI 10s5CJCGtLtNzmMepUZC128-QMr_2JtzR 1Qe6BOYbz97UNo6JNjDRGLegwLBK1WEde 1VbkABticCo-URxQpHfVZ9B07RQRaolKJ 15QgO7dPd1iYL4fKCSIHjMEXLRT345-VA 1OC6iRP13gHDyfibwFyvRtoYaSX8NyxjX 1gOO1N7scARh8Is5qxFtsHlLK0oSs_4W0; do
            curl -sSL -m 90 -c /tmp/ck -b /tmp/ck -o "/tmp/$id.bin" "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t&authuser=0"
            echo "$id $(stat -c%s /tmp/$id.bin) $(file -b /tmp/$id.bin | cut -c1-60)" | tee -a _tmp/drive/log.txt
            if ! file /tmp/$id.bin | grep -qiE 'heif|heic|iso media|jpeg'; then
              curl -sSL -m 90 -o "/tmp/$id.bin" "https://drive.google.com/uc?export=download&id=$id"
              echo "  retry $(stat -c%s /tmp/$id.bin) $(file -b /tmp/$id.bin | cut -c1-60)" | tee -a _tmp/drive/log.txt
            fi
          done
          python3 - <<'PY'
          import glob, os
          from PIL import Image, ImageOps
          import pillow_heif; pillow_heif.register_heif_opener()
          for f in glob.glob('/tmp/*.bin'):
              try:
                  im = ImageOps.exif_transpose(Image.open(f)).convert('RGB'); im.thumbnail((2000,2000))
                  im.save('_tmp/drive/' + os.path.basename(f)[:-4] + '.jpg', quality=84)
              except Exception as e:
                  open('_tmp/drive/log.txt','a').write(f'ERR {f} {e}\n')
          PY
          ls -la _tmp/drive
      - name: Commit
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -A _tmp; git commit -qm "tmp: drive2" || true; git push origin HEAD:tmp-crawl
