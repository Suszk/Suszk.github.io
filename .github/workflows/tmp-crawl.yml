name: tmp-crawl
on:
  push:
    branches: [tmp-crawl]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: tmp-crawl }
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libheif-examples imagemagick >/dev/null
      - name: Drive photos
        run: |
          set +e
          mkdir -p _tmp/drive
          for id in 1KDm-FHmAbos6MbbBto9JfEw4wAsSHQ4- 1wpvV25I5EJP43nuMURfND_l05lqq6xqy 1cMmhJOhPifalYX7A30ogoLpv_EioLYpJ 10hzjvLpmzdUSnnokhymBfC3w0vVLVhZK 17yEtopbdbBowp1cwmHf6GdkceWsClnA5 12_Yw24Gmme7zfKp4asdLKP9BhQMaFDoI 10s5CJCGtLtNzmMepUZC128-QMr_2JtzR 1Qe6BOYbz97UNo6JNjDRGLegwLBK1WEde 1VbkABticCo-URxQpHfVZ9B07RQRaolKJ 15QgO7dPd1iYL4fKCSIHjMEXLRT345-VA 1OC6iRP13gHDyfibwFyvRtoYaSX8NyxjX 1gOO1N7scARh8Is5qxFtsHlLK0oSs_4W0; do
            curl -sSL -m 60 -o "/tmp/$id.bin" "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t"
            file "/tmp/$id.bin"
            heif-convert -q 90 "/tmp/$id.bin" "/tmp/$id.jpg" >/dev/null 2>&1 && convert "/tmp/$id.jpg" -auto-orient -resize 2000x2000\> -quality 84 "_tmp/drive/$id.jpg"
          done
          ls -la _tmp/drive
      - name: denvibes.com home
        run: |
          set +e
          UA="Mozilla/5.0 (Macintosh) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          mkdir -p _tmp/site
          curl -sSL -m 30 -A "$UA" https://denvibes.com/ -o _tmp/site/home.html
          sed 's/\\\//\//g; s/&quot;/"/g; s/&#038;/\&/g' _tmp/site/home.html | grep -oE 'https?://[^"'"'"' )<>,]+\.(png|jpe?g|webp|svg|gif|mp4|webm|mov)' | awk '!s[$0]++' > _tmp/site/urls.txt
          wc -l _tmp/site/urls.txt
          i=0; while read u; do i=$((i+1)); ext="${u##*.}"; out="_tmp/site/a$(printf %03d $i).$ext"
            curl -sSfL -m 120 -A "$UA" -o "$out" "$u" && echo -e "$(basename $out)\t$(stat -c%s $out)\t$u" >> _tmp/site/dl.tsv || rm -f "$out"
          done < _tmp/site/urls.txt
          # drop huge non-video files, keep everything else
          find _tmp/site -name '*.mp4' -size +95M -delete
          du -sh _tmp
      - name: Commit
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -A _tmp; git commit -qm "tmp: drive+site" || true; git push origin HEAD:tmp-crawl
