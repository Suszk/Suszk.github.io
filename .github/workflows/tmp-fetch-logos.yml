name: tmp-fetch-logos
on:
  push:
    branches: [tmp-logo-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-logo-fetch
      - name: Download logos
        run: |
          mkdir -p _tmp/logos
          for i in $(seq 1 14); do curl -sSfL -A "Mozilla/5.0" -o _tmp/logos/$i-w.png "https://denvibes.com/wp-content/uploads/2023/11/$i-w.png" || echo "fail $i"; done
          ls -la _tmp/logos
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add _tmp/logos
          git commit -m "tmp: logos" || echo nothing
          git push origin HEAD:tmp-logo-fetch
